# Netlify reads this file automatically (repo root = this app).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Paste your Apps Script /exec URL here (public by design — every action is checked against a session token).
  VITE_ENDPOINT = "mock"
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
