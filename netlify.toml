# Netlify reads this file automatically (repo root = this app).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Replace "mock" with your Apps Script /exec URL to go live ("mock" = demo site with sample data, stored in each visitor's browser).
  # This value overrides one set in the Netlify UI. It's public by design: it ships in the site's JavaScript,
  # and every request is checked against a signed-in session — so it's excluded from Netlify's secret scan.
  VITE_ENDPOINT = "mock"
  SECRETS_SCAN_OMIT_KEYS = "VITE_ENDPOINT"
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
